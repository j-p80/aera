<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Support</title>
    <!-- Add Content Security Policy meta tag to allow Intercom domains -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://widget.intercom.io https://js.intercomcdn.com https://api-iam.intercom.io; connect-src https://api-iam.intercom.io wss://*.intercom.io; img-src 'self' https://js.intercomcdn.com data:; style-src 'self' 'unsafe-inline'; frame-src 'self' https://intercom-sheets.com;">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            height: 100vh;
            width: 100vw;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .loading {
            text-align: center;
            font-size: 18px;
            color: #333;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border-radius: 50%;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            animation: spin 1.5s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>Loading Intercom Chat...</p>
    </div>
    
    <!-- Intercom implementation -->
    <script>
        // Function to get URL parameters
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            
            // Get all parameter values with fallbacks
            params.userId = urlParams.get('userId') || 'anonymous-' + Math.random().toString(36).substr(2, 9);
            params.userName = urlParams.get('userName') || 'Guest User';
            params.userEmail = urlParams.get('userEmail') || '';
            params.createdAt = urlParams.get('createdAt') ? parseInt(urlParams.get('createdAt')) : Math.floor(Date.now() / 1000);
            
            return params;
        }
        
        // Get user data from URL
        const userData = getUrlParams();
        
        // Log for debugging
        console.log("User data from URL:", userData);
        
        // Set up Intercom settings exactly as in the standard snippet
        window.intercomSettings = {
            api_base: "https://api-iam.intercom.io",
            app_id: "qqgifgto",
            user_id: userData.userId,
            name: userData.userName,
            email: userData.userEmail,
            created_at: userData.createdAt
        };
        
        // Standard Intercom snippet
        (function(){var w=window;var ic=w.Intercom;if(typeof ic==="function"){ic('reattach_activator');ic('update',w.intercomSettings);}else{var d=document;var i=function(){i.c(arguments);};i.q=[];i.c=function(args){i.q.push(args);};w.Intercom=i;var l=function(){var s=d.createElement('script');s.type='text/javascript';s.async=true;s.src='https://widget.intercom.io/widget/qqgifgto';var x=d.getElementsByTagName('script')[0];x.parentNode.insertBefore(s,x);};if(document.readyState==='complete'){l();}else if(w.attachEvent){w.attachEvent('onload',l);}else{w.addEventListener('load',l,false);}}})();
    </script>
    
    <!-- Additional script to auto-show Intercom and handle debugging -->
    <script>
        // Function to check if Intercom is loaded
        function isIntercomLoaded() {
            return typeof window.Intercom === 'function' && window.Intercom.booted;
        }
        
        // Auto-show Intercom when loaded
        function checkAndShowIntercom() {
            console.log("Checking if Intercom is loaded...");
            
            if (isIntercomLoaded()) {
                console.log("Intercom loaded successfully, showing messenger");
                window.Intercom('show');
                
                // Hide the loading indicator
                document.querySelector('.loading').style.display = 'none';
                
                // Stop checking
                clearInterval(intercomCheckInterval);
            } else {
                console.log("Intercom not loaded yet, waiting...");
            }
        }
        
        // Check every second if Intercom is loaded
        const intercomCheckInterval = setInterval(checkAndShowIntercom, 1000);
        
        // Fallback: If Intercom doesn't load within 10 seconds, show an error
        setTimeout(function() {
            if (!isIntercomLoaded()) {
                console.error("Intercom failed to load within timeout period");
                document.querySelector('.loading p').textContent = 
                    "There was an issue loading the chat widget. Please try refreshing the page.";
                clearInterval(intercomCheckInterval);
            }
        }, 10000);
    </script>
</body>
</html>
