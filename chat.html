<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Support</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            font-size: 18px;
            color: #333;
            text-align: center;
            max-width: 80%;
        }
        
        .error {
            color: #e74c3c;
            margin-top: 20px;
            display: none;
        }
        
        .button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: none;
        }
        
        .button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>
    <div class="message" id="message">Initializing chat support...</div>
    <div class="error" id="error">
        There was a problem loading the chat widget. 
        <br>Please try refreshing the page.
    </div>
    <button class="button" id="manual-load">Try Manual Load</button>

    <script>
        // Function to parse URL parameters
        function getUrlParams() {
            const params = {};
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            
            params.userId = urlParams.get('userId') || 'anonymous-' + Math.random().toString(36).substring(2, 9);
            params.userName = urlParams.get('userName') || 'Guest User';
            params.userEmail = urlParams.get('userEmail') || null;
            params.createdAt = urlParams.get('createdAt') ? parseInt(urlParams.get('createdAt')) : Math.floor(Date.now() / 1000);
            
            return params;
        }

        // Get the URL parameters
        const userData = getUrlParams();
        
        // Function to initialize Intercom with delay
        function initializeIntercom() {
            // Configure Intercom with user data
            window.intercomSettings = {
                api_base: "https://api-iam.intercom.io",
                app_id: "qqgifgto",
                user_id: userData.userId,
                name: userData.userName,
                email: userData.userEmail,
                created_at: userData.createdAt
            };
            
            console.log("Intercom settings configured:", window.intercomSettings);
            
            // Load Intercom script directly
            const script = document.createElement('script');
            script.async = true;
            script.src = "https://widget.intercom.io/widget/qqgifgto";
            
            // Handle load success
            script.onload = function() {
                console.log("Intercom script loaded successfully");
                document.getElementById('loader').style.display = 'none';
                document.getElementById('message').innerText = "Chat support is ready!";
                
                // Show Intercom after a short delay
                setTimeout(function() {
                    if (window.Intercom) {
                        console.log("Opening Intercom messenger");
                        window.Intercom('show');
                    }
                }, 1000);
            };
            
            // Handle load error
            script.onerror = function() {
                console.error("Failed to load Intercom script");
                document.getElementById('loader').style.display = 'none';
                document.getElementById('message').innerText = "Could not load chat support";
                document.getElementById('error').style.display = 'block';
                document.getElementById('manual-load').style.display = 'block';
            };
            
            document.head.appendChild(script);
            console.log("Intercom script added to head");
        }
        
        // Initialize with a delay to ensure DOM is fully loaded
        setTimeout(initializeIntercom, 500);
        
        // Add a manual load button for fallback
        document.getElementById('manual-load').addEventListener('click', function() {
            this.disabled = true;
            this.innerText = "Loading...";
            document.getElementById('loader').style.display = 'block';
            document.getElementById('message').innerText = "Trying alternative loading method...";
            document.getElementById('error').style.display = 'none';
            
            // Try the standard Intercom snippet as fallback
            try {
                (function(){
                    var w=window;
                    var ic=w.Intercom;
                    if(typeof ic==="function"){
                        ic('reattach_activator');
                        ic('update',w.intercomSettings);
                    }else{
                        var d=document;
                        var i=function(){i.c(arguments);};
                        i.q=[];
                        i.c=function(args){i.q.push(args);};
                        w.Intercom=i;
                        var l=function(){
                            var s=d.createElement('script');
                            s.type='text/javascript';
                            s.async=true;
                            s.src='https://widget.intercom.io/widget/qqgifgto';
                            var x=d.getElementsByTagName('script')[0];
                            x.parentNode.insertBefore(s,x);
                        };
                        if(d.readyState==='complete'){
                            l();
                        }else if(w.attachEvent){
                            w.attachEvent('onload',l);
                        }else{
                            w.addEventListener('load',l,false);
                        }
                    }
                })();
                
                // Check if Intercom loads after a delay
                setTimeout(function() {
                    if (window.Intercom && typeof window.Intercom === 'function') {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('message').innerText = "Chat support is ready!";
                        document.getElementById('manual-load').style.display = 'none';
                        window.Intercom('show');
                    } else {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('message').innerText = "Could not load chat support";
                        document.getElementById('error').style.display = 'block';
                        document.getElementById('manual-load').innerText = "Reload Page";
                        document.getElementById('manual-load').addEventListener('click', function() {
                            window.location.reload();
                        });
                    }
                }, 3000);
            } catch (error) {
                console.error("Error in fallback script:", error);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('message').innerText = "Could not load chat support";
                document.getElementById('error').innerText = "Error: " + error.message;
                document.getElementById('error').style.display = 'block';
                document.getElementById('manual-load').innerText = "Reload Page";
                document.getElementById('manual-load').disabled = false;
                document.getElementById('manual-load').addEventListener('click', function() {
                    window.location.reload();
                });
            }
        });
    </script>
</body>
</html>
