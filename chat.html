<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intercom Debug</title>
    <!-- Allow all required domains in CSP -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob: 'unsafe-inline'; frame-src *; style-src * 'unsafe-inline';">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.5;
        }
        
        .debug-panel {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        
        .debug-log {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            background-color: #333;
            color: #fff;
            font-family: monospace;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            word-wrap: break-word;
        }
        
        .error {
            color: #ff6b6b;
        }
        
        .success {
            color: #51cf66;
        }
        
        .info {
            color: #74c0fc;
        }
        
        button {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #228be6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #1971c2;
        }
        
        .loading {
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border-radius: 50%;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            animation: spin 1.5s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Intercom Debug Page</h1>
    
    <div class="loading">
        <div class="spinner"></div>
        <p>Loading Intercom Chat...</p>
    </div>
    
    <div class="debug-panel">
        <h2>Debug Information</h2>
        <p><strong>URL Parameters:</strong> <span id="url-params">Loading...</span></p>
        <p><strong>Intercom Status:</strong> <span id="intercom-status">Not initialized</span></p>
        
        <h3>Console Log</h3>
        <div class="debug-log" id="debug-log"></div>
        
        <button id="force-load">Force Load Intercom</button>
        <button id="open-messenger">Open Messenger</button>
    </div>
    
    <script>
        // Custom logging function
        function debugLog(message, type = 'info') {
            // Log to console
            console.log(message);
            
            // Add to debug panel
            const logContainer = document.getElementById('debug-log');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // Override console.log and console.error
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        
        console.log = function(message) {
            originalConsoleLog.apply(console, arguments);
            if (typeof message === 'object') {
                try {
                    message = JSON.stringify(message);
                } catch(e) {
                    message = String(message);
                }
            }
            debugLog(message, 'info');
        };
        
        console.error = function(message) {
            originalConsoleError.apply(console, arguments);
            if (typeof message === 'object') {
                try {
                    message = JSON.stringify(message);
                } catch(e) {
                    message = String(message);
                }
            }
            debugLog(message, 'error');
        };
        
        // Function to get URL parameters
        function getUrlParams() {
            const params = {};
            try {
                const queryString = window.location.search;
                const urlParams = new URLSearchParams(queryString);
                
                params.userId = urlParams.get('userId') || 'anonymous-' + Math.random().toString(36).substr(2, 9);
                params.userName = urlParams.get('userName') || 'Guest User';
                params.userEmail = urlParams.get('userEmail') || '';
                params.createdAt = urlParams.get('createdAt') ? parseInt(urlParams.get('createdAt')) : Math.floor(Date.now() / 1000);
                
                // Display in UI
                document.getElementById('url-params').textContent = JSON.stringify(params, null, 2);
                
                debugLog('URL parameters parsed: ' + JSON.stringify(params));
            } catch (error) {
                debugLog('Error parsing URL parameters: ' + error.message, 'error');
            }
            return params;
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('DOM loaded');
            
            // Get user data from URL
            const userData = getUrlParams();
            
            // Setup force load button
            document.getElementById('force-load').addEventListener('click', function() {
                loadIntercom(userData);
                debugLog('Manually triggered Intercom load');
            });
            
            // Setup open messenger button
            document.getElementById('open-messenger').addEventListener('click', function() {
                if (window.Intercom) {
                    window.Intercom('show');
                    debugLog('Manually opened Intercom messenger');
                } else {
                    debugLog('Intercom not available yet', 'error');
                }
            });
            
            // Load Intercom automatically
            loadIntercom(userData);
        });
        
        // Function to load Intercom
        function loadIntercom(userData) {
            debugLog('Setting up Intercom with user data');
            
            // Set up Intercom settings
            window.intercomSettings = {
                api_base: "https://api-iam.intercom.io",
                app_id: "qqgifgto",
                user_id: userData.userId,
                name: userData.userName,
                email: userData.userEmail,
                created_at: userData.createdAt
            };
            
            debugLog('Intercom settings configured: ' + JSON.stringify(window.intercomSettings));
            
            // Try to load the Intercom script directly
            const scriptElement = document.createElement('script');
            scriptElement.async = true;
            scriptElement.src = 'https://widget.intercom.io/widget/qqgifgto';
            scriptElement.onload = function() {
                debugLog('Intercom script loaded successfully', 'success');
                document.getElementById('intercom-status').textContent = 'Script loaded';
                document.getElementById('intercom-status').style.color = 'green';
                
                // Auto-open Intercom
                setTimeout(function() {
                    if (window.Intercom) {
                        window.Intercom('show');
                        debugLog('Automatically opened Intercom messenger', 'success');
                    }
                }, 1000);
            };
            scriptElement.onerror = function() {
                debugLog('Failed to load Intercom script directly', 'error');
                document.getElementById('intercom-status').textContent = 'Script failed to load';
                document.getElementById('intercom-status').style.color = 'red';
                
                // Try using the standard snippet as fallback
                loadIntercomStandardSnippet();
            };
            
            document.head.appendChild(scriptElement);
            debugLog('Added Intercom script to document head');
        }
        
        // Fallback to standard snippet
        function loadIntercomStandardSnippet() {
            debugLog('Attempting to load Intercom using standard snippet');
            
            try {
                (function(){var w=window;var ic=w.Intercom;if(typeof ic==="function"){ic('reattach_activator');ic('update',w.intercomSettings);}else{var d=document;var i=function(){i.c(arguments);};i.q=[];i.c=function(args){i.q.push(args);};w.Intercom=i;var l=function(){var s=d.createElement('script');s.type='text/javascript';s.async=true;s.src='https://widget.intercom.io/widget/qqgifgto';var x=d.getElementsByTagName('script')[0];x.parentNode.insertBefore(s,x);};if(document.readyState==='complete'){l();}else if(w.attachEvent){w.attachEvent('onload',l);}else{w.addEventListener('load',l,false);}}})();
                
                debugLog('Standard Intercom snippet executed');
                document.getElementById('intercom-status').textContent = 'Using standard snippet';
                document.getElementById('intercom-status').style.color = 'orange';
            } catch (error) {
                debugLog('Error executing standard Intercom snippet: ' + error.message, 'error');
            }
        }
        
        // Function to check if Intercom is loaded
        function checkIntercomStatus() {
            if (window.Intercom && typeof window.Intercom === 'function') {
                debugLog('Intercom is available as a function', 'success');
                document.getElementById('intercom-status').textContent = 'Available';
                document.getElementById('intercom-status').style.color = 'green';
                document.querySelector('.loading').style.display = 'none';
                return true;
            } else {
                debugLog('Intercom not available yet', 'info');
                return false;
            }
        }
        
        // Check Intercom status periodically
        setInterval(checkIntercomStatus, 2000);
        
        // Timeout for loading
        setTimeout(function() {
            if (!checkIntercomStatus()) {
                debugLog('Intercom failed to load within timeout period', 'error');
                document.querySelector('.loading p').textContent = 'Failed to load Intercom. See debug panel below.';
            }
        }, 20000);
    </script>
</body>
</html>
